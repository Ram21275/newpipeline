[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lger"
version = "0.1.0"
description = "Logit-Guided Evidence Routing for frozen vision-language models"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
